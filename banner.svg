<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Dark gradient overlay to make text readable over the background -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.85" />
    </linearGradient>
    
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #ffffff; font-size: 26px; }
      .subtitle { font-family: "Fira Code", monospace; font-weight: 600; fill: #36BCF7; font-size: 16px; }
    </style>
  </defs>

  <!-- Background Pixelated Image -->
  

  <!-- Semi-transparent overlay layer -->
  <rect width="800" height="250" fill="url(#overlay)" />

  <!-- Overlaid Text Content -->
  <g transform="translate(40, 100)">
    <text x="0" y="0" class="title">Hi there 👋, I'm Peter Owili</text>
    <text x="0" y="40" class="subtitle">> Data Engineer | Web Developer | B.Eng Student</text>
  </g>
</svg>
