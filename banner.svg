<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background styling and grid overlay for a clean tech/pixel look -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Subtle pixel grid pattern to simulate pixel background texture -->
    <pattern id="pixelGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>
    
    <style>
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        font-weight: 700; 
        fill: #ffffff; 
        font-size: 28px; 
      }
      .subtitle { 
        font-family: "Fira Code", monospace; 
        font-weight: 600; 
        fill: #36BCF7; 
        font-size: 16px; 
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="800" height="220" fill="url(#bgGradient)" />
  <rect width="800" height="220" fill="url(#pixelGrid)" />

  <!-- Decorative Accent Bar -->
  <rect x="0" y="0" width="800" height="4" fill="#36BCF7" />

  <!-- Overlaid Header Text -->
  <g transform="translate(45, 100)">
    <text x="0" y="0" class="title">Hi there 👋, I'm Peter Owili</text>
    <text x="0" y="42" class="subtitle">> Data Analyst | Web Developer</text>
  </g>
</svg>
