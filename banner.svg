<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Dark-Gray Monochrome Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#2b2b2b" />
    </linearGradient>

    <!-- High-Visibility Pixel Grid Pattern -->
    <pattern id="pixelGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.22" />
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.3" />
    </pattern>
    
    <style>
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        font-weight: 700; 
        fill: #ffffff; 
        font-size: 28px; 
      }
      .subtitle { 
        font-family: "Fira Code", monospace; 
        font-weight: 600; 
        fill: #cccccc; 
        font-size: 16px; 
      }
    </style>
  </defs>

  <!-- Base Dark-Gray Background -->
  <rect width="800" height="220" fill="url(#bgGradient)" />
  <rect width="800" height="220" fill="url(#pixelGrid)" />

  <!-- Clean Monochrome Top Accent Bar -->
  <rect x="0" y="0" width="800" height="4" fill="#ffffff" />

  <!-- Overlaid Header Text -->
  <g transform="translate(45, 100)">
    <text x="0" y="0" class="title">Hi there 👋, I'm Peter Owili</text>
    <text x="0" y="42" class="subtitle">> Data Engineer & Researcher | Web Developer</text>
  </g>
</svg>
