<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Dark gradient overlay so white/blue text stands out clearly against the B&W pixels -->
    <linearGradient id="darkOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.88" />
    </linearGradient>
    
    <style>
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        font-weight: 700; 
        fill: #ffffff; 
        font-size: 28px; 
      }
      .subtitle { 
        font-family: "Fira Code", monospace; 
        font-weight: 600; 
        fill: #36BCF7; 
        font-size: 16px; 
      }
    </style>
  </defs>

  <!-- 1. Pixelated Black & White Image as Background -->
  

  <!-- 2. Dark Overlay Layer for Readability -->
  <rect width="800" height="220" fill="url(#darkOverlay)" />

  <!-- 3. Overlaid Header Text -->
  <g transform="translate(45, 90)">
    <text x="0" y="0" class="title">Hi there 👋, I'm Peter Owili</text>
    <text x="0" y="42" class="subtitle">> Data Engineer & Researcher | Web Developer</text>
  </g>
</svg>
